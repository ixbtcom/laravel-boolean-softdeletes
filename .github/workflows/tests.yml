name: Tests

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master, next, next-major, beta, alpha]

jobs:
    phpunit:
        runs-on: [self-hosted, Linux, X64, docker]
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        container: chialab/php:${{ matrix.php }}
        steps:
            - uses: actions/checkout@v4
            - name: Install and audit dependencies
              run: |
                  composer self-update 2.11.1 --no-interaction
                  composer --version
                  composer validate --strict
                  composer install --prefer-dist --no-progress --no-interaction
                  mkdir -p build
                  composer audit --locked --format=json > build/composer-audit.json
                  composer show --direct --format=json > build/composer-versions.json
            - name: Execute phpunit
              run: composer test -- --colors=always --log-junit build/junit.xml
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: phpunit-${{ matrix.php || '8.4' }}
                  path: build/

    phpstan:
        runs-on: [self-hosted, Linux, X64, docker]
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        container: chialab/php:${{ matrix.php }}
        steps:
            - uses: actions/checkout@v4
            - name: Install and audit dependencies
              run: |
                  composer self-update 2.11.1 --no-interaction
                  composer --version
                  composer validate --strict
                  composer install --prefer-dist --no-progress --no-interaction
                  mkdir -p build
                  composer audit --locked --format=json > build/composer-audit.json
                  composer show --direct --format=json > build/composer-versions.json
            - name: Execute phpstan
              run: composer phpstan
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: phpstan-${{ matrix.php || '8.4' }}
                  path: build/

    php-cs-fixer:
        runs-on: [self-hosted, Linux, X64, docker]
        container: chialab/php:8.4
        steps:
            - uses: actions/checkout@v4
            - name: Install and audit dependencies
              run: |
                  composer self-update 2.11.1 --no-interaction
                  composer --version
                  composer validate --strict
                  composer install --prefer-dist --no-progress --no-interaction
                  mkdir -p build
                  composer audit --locked --format=json > build/composer-audit.json
                  composer show --direct --format=json > build/composer-versions.json
            - name: Execute php-cs-fixer
              run: composer cs-fix -- --dry-run --diff --using-cache=no
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: php-cs-fixer-8.4
                  path: build/

    prettier:
        runs-on: [self-hosted, Linux, X64, docker]
        container: node:22-bookworm-slim
        steps:
            - uses: actions/checkout@v4
            - name: Check formatting
              run: |
                  corepack enable
                  corepack prepare pnpm@11.1.2 --activate
                  pnpm dlx prettier@3.6.2 --check .
