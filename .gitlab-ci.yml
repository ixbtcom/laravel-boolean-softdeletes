workflow:
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - if: $CI_COMMIT_BRANCH =~ /^ci\/(batch|local)-/
        - if: $CI_COMMIT_TAG

default:
    tags: [docker]

check:
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.20
    timeout: 5m
    variables:
        GIT_DEPTH: '0'
    script:
        - apk add --no-cache git >/dev/null
        - base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
        - |
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
                echo "cannot identify a root commit in a shallow clone" >&2
                exit 1
              fi
              head=$(git rev-parse HEAD) || exit 1
              ancestry=$(git rev-list --parents -n 1 HEAD) || exit 1
              if [ "$ancestry" = "$head" ]; then
                echo "root commit: no previous commit"
                exit 0
              fi
              base=$(git rev-parse --verify HEAD^) || exit 1
            fi
            if [ -z "$base" ]; then
              echo "missing diff base" >&2
              exit 1
            elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "diff base is not available in the full clone" >&2
              exit 1
            else
              git diff --check "$base" HEAD
            fi

.php:
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/chialab/php:${PHP_VERSION}
    timeout: 20m
    retry:
        max: 1
        exit_codes: [100]
    variables:
        PHP_VERSION: '8.4'
        COMPOSER_NO_INTERACTION: '1'
    before_script:
        - php --version
        - composer self-update 2.11.1 --no-interaction
        - composer --version
        - composer validate --strict
        - composer install --prefer-dist --no-progress --no-interaction
        - mkdir -p build
        - composer audit --locked --format=json > build/composer-audit.json
        - composer show --direct --format=json > build/composer-versions.json
    artifacts:
        when: always
        paths:
            - build/composer-audit.json
            - build/composer-versions.json
        expire_in: 1 week

.laravel13:
    extends: .php
    parallel:
        matrix:
            - PHP_VERSION: ['8.4', '8.5']

phpunit:
    extends: .laravel13
    script:
        - composer test -- --colors=always --log-junit build/junit.xml
    artifacts:
        when: always
        paths:
            - build/composer-audit.json
            - build/composer-versions.json
            - build/junit.xml
        reports:
            junit: build/junit.xml
        expire_in: 1 week

phpstan:
    extends: .laravel13
    script:
        - composer phpstan

php-cs-fixer:
    extends: .php
    script:
        - composer cs-fix -- --dry-run --diff --using-cache=no

prettier:
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-bookworm-slim
    timeout: 10m
    before_script:
        - corepack enable
        - corepack prepare pnpm@11.1.2 --activate
        - node --version
        - pnpm --version
    script:
        - pnpm dlx prettier@3.6.2 --check .
